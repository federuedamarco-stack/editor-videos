<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Bebas Neue";src:url("bebas-neue-400.woff2") format("woff2")}
@font-face{font-family:"Figtree";src:url("figtree-700.woff2") format("woff2");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#121311}
.foto{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.band{position:absolute;left:0;right:0;top:1240px;bottom:0;background:#121311;border-top:6px solid #BEBD39}
.logo{position:absolute;left:80px;top:1290px;width:250px}
.title{position:absolute;left:80px;right:140px;top:1380px;font-family:"Bebas Neue";font-size:134px;line-height:.88;white-space:nowrap;letter-spacing:.01em;text-transform:uppercase;color:#F6F6F1}
.title span{color:#BEBD39}
.tag{position:absolute;left:80px;top:280px;display:inline-flex;align-items:center;gap:14px;height:60px;padding:0 28px;border-radius:999px;background:rgba(18,19,17,.88);border:2px solid #3A3B35;color:#F6F6F1;font:700 30px/1 "Figtree";letter-spacing:.06em;text-transform:uppercase}
.tag i{width:16px;height:16px;border-radius:999px;background:#BEBD39}
.web{position:absolute;left:80px;top:1680px;font:700 38px/1 "Figtree";color:#A9A99E;letter-spacing:.01em}
</style></head><body>
<img class="foto" src="foto.jpg">
<div class="band"></div>
<img class="logo" src="exomov-logo-blanco.png">
<div class="title">Cómo probar<br><span>un exoesqueleto</span></div>
<div class="tag"><i></i>4 pasos</div>
<div class="web">exomov.com</div>
</body></html>
