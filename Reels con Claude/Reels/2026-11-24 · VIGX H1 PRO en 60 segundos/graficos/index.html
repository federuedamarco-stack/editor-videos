<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #121311; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #zoom { position: absolute; inset: 0; transform-origin: 50% 35%; }
      #base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .layer { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60.0" data-width="1080" data-height="1920">
      <div id="zoom"><video id="base" class="clip" src="assets/base.mp4" muted playsinline data-start="0" data-duration="60.0" data-track-index="0"></video></div>
      <div id="captions-host" class="layer" data-composition-id="captions" data-composition-src="compositions/captions.html" data-track-kind="captions" data-start="0" data-duration="60.0" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="graphics-host" class="layer" data-composition-id="graphics" data-composition-src="compositions/graphics.html" data-start="0" data-duration="60.0" data-track-index="3" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#zoom", { scale: 1.06 }, { scale: 1.0, duration: 0.7, ease: "power3.out", immediateRender: true }, 0.0);
      tl.fromTo("#zoom", { scale: 1.0 }, { scale: 1.04, duration: 2.5, ease: "sine.inOut", immediateRender: false }, 7.47);
      tl.fromTo("#zoom", { scale: 1.0 }, { scale: 1.0, duration: 0.01, ease: "none", immediateRender: false }, 9.97);
      tl.fromTo("#zoom", { scale: 1.0 }, { scale: 1.04, duration: 3.4, ease: "sine.inOut", immediateRender: false }, 28.27);
      tl.fromTo("#zoom", { scale: 1.0 }, { scale: 1.0, duration: 0.01, ease: "none", immediateRender: false }, 31.67);
      tl.fromTo("#zoom", { scale: 1.0 }, { scale: 1.05, duration: 4.1, ease: "sine.inOut", immediateRender: false }, 43.63);
      tl.fromTo("#zoom", { scale: 1.0 }, { scale: 1.0, duration: 0.01, ease: "none", immediateRender: false }, 47.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
